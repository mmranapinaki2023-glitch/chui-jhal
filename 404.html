<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>পাতাটি পাওয়া যায়নি · চুইঘর</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Bangla&family=Hind+Siliguri:wght@400;600&display=swap">
<style>
:root{--ground:#F3E7D3;--surface:#FCF6EA;--ink:#2B1A11;--ink-2:#6E5540;--line:#DCC7A6;--accent:#8C2F1F;--accent-ink:#FFF6EA;--bark-1:#7A4E2C;--bark-2:#412818;--wood-1:#E9D5A8}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--ground:#17100A;--surface:#221710;--ink:#F2E4CD;--ink-2:#BCA184;--line:#3D2B1D;--accent:#E2764F;--accent-ink:#1B1009}
}
:root[data-theme="dark"]{--ground:#17100A;--surface:#221710;--ink:#F2E4CD;--ink-2:#BCA184;--line:#3D2B1D;--accent:#E2764F;--accent-ink:#1B1009}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;
  background:var(--ground);color:var(--ink);font-family:"Hind Siliguri",system-ui,sans-serif;line-height:1.6}
.box{text-align:center;max-width:44ch}
h1{font-family:"Tiro Bangla",Georgia,serif;font-weight:400;font-size:clamp(30px,6vw,44px);margin:20px 0 10px;line-height:1.25}
p{color:var(--ink-2);margin:0 0 26px}
a{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);
  text-decoration:none;font-weight:600;padding:12px 24px;border-radius:999px}
svg{width:64px;height:64px}
</style>
</head>
<body>
  <div class="box">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <path d="M20 4c-7 5-11 10-11 17a11 11 0 0 0 22 0c0-7-4-12-11-17Z" fill="var(--bark-1)"/>
      <path d="M20 4c-7 5-11 10-11 17a11 11 0 0 0 11 11V4Z" fill="var(--bark-2)"/>
      <path d="M20 12v18" stroke="var(--wood-1)" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <h1>এই পাতাটি খুঁজে পাওয়া গেল না</h1>
    <p>লিংকটা হয়তো ভুল, বা পাতাটি সরিয়ে ফেলা হয়েছে। দোকানে ফিরে যান।</p>
    <a href="/">দোকানে ফিরুন</a>
  </div>
</body>
</html>
